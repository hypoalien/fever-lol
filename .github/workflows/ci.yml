name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never a real secret: CI runs against a throwaway Postgres in a container.
  DATABASE_URL: postgres://fever:fever@localhost:5432/fever_lol
  BETTER_AUTH_SECRET: ci-secret-not-used-outside-ci
  # Gateway secrets are encrypted at rest, so the payment settings endpoints
  # need a key to be set at all. Also throwaway: the only ciphertext it ever
  # protects is the fake key the e2e suite stores and reads back.
  ENCRYPTION_KEY: ci-encryption-key-not-used-outside-ci

jobs:
  check:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fever
          POSTGRES_PASSWORD: fever
          POSTGRES_DB: fever_lol
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fever"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Migrate
        run: bunx drizzle-kit migrate

      - name: Integration tests
        # The prepare script assumes the local Docker container, so the tests
        # are invoked directly against the service container here.
        run: bunx vitest run --config vitest.integration.config.mts
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fever
          POSTGRES_PASSWORD: fever
          POSTGRES_DB: fever_lol_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fever"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Migrate and seed
        run: |
          bunx drizzle-kit migrate
          bun run scripts/seed.ts
        env:
          DATABASE_URL: postgres://fever:fever@localhost:5432/fever_lol_e2e

      - name: End-to-end tests
        run: bunx playwright test
        env:
          CI: "true"
          E2E_DATABASE_URL: postgres://fever:fever@localhost:5432/fever_lol_e2e
          # The suite's global setup drives the local Docker container, which
          # does not exist here; the database above is already prepared.
          E2E_SKIP_DB_SETUP: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
